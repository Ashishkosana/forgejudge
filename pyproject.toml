[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "forgejudge"
version = "0.1.0"
description = "A cloud-native online coding platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "docker>=7.1,<8.0",
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "redis>=5.0,<7.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "tests"]
addopts = "-ra --strict-config --strict-markers -m 'not integration'"
asyncio_mode = "auto"
markers = ["integration: requires live PostgreSQL and Redis services"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
